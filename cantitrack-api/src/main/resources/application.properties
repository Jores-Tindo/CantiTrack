spring.application.name=cantitrack-api
server.port=8080

# Base MySQL (variables d'environnement en production)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cantitrack?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
spring.datasource.username=${DB_USER:cantitrack}
spring.datasource.password=${DB_PASSWORD}
# validate = ne modifie jamais le schéma. Premier démarrage : DDL_AUTO=update (ou profil dev)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false

# JSON en snake_case, comme les colonnes SQLite du mobile (produit_id, date_modif...)
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.time-zone=UTC

# Sécurité
cantitrack.jwt-secret=${JWT_SECRET}
cantitrack.jwt-ttl-hours=12
cantitrack.cors-origins=${CORS_ORIGINS:*}
cantitrack.admin-login=${ADMIN_LOGIN:admin}
cantitrack.admin-password=${ADMIN_PASSWORD}
cantitrack.seed-demo=false
